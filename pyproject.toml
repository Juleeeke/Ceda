[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ceda"
version = "0.1.0"
description = "Local, layout-aware PCB power integrity workbench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=2.1,<3", "scipy>=1.14,<2", "shapely>=2.1,<3",
  "gmsh>=4.14,<5", "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.scripts]
ceda = "ceda.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ceda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
