<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ceda · 白色界面风格比较</title><link rel="icon" href="assets/ceda-icon.png"><style>
*{box-sizing:border-box}body{margin:0;color:#252a33;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;font-size:13px}.gallery{display:grid;grid-template-rows:auto 1fr;height:100dvh}.header{padding:17px 24px 16px;border-bottom:1px solid #e5e8ed;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:37px;height:37px;object-fit:contain}.brand strong{display:block;font-size:17px;font-weight:600}.brand small{display:block;margin-top:3px;font-size:11px;color:#8a919b}.options{display:flex;gap:8px}.option{border:1px solid #e6e8ec;border-radius:7px;background:#fff;padding:9px 14px;cursor:pointer;text-align:left;color:#596272;min-width:164px}.option strong{display:block;font-size:12px;font-weight:550;color:#3e4652}.option small{font-size:10px;display:block;margin-top:3px;color:#939ba5}.option.active{border-color:#9aa4b3;background:#f7f8fa}.option.active strong{color:#202632}.actions{display:flex;align-items:center;gap:9px}.actions a,.actions button{font:inherit;font-size:11px;padding:9px 11px;border:1px solid #e2e5eb;border-radius:6px;background:#fff;color:#657185;cursor:pointer;text-decoration:none}.actions button{background:#262d36;color:#fff;border-color:#262d36}.frame{padding:0;min-height:0}iframe{border:0;width:100%;height:100%;background:#fff;display:block}.note{color:#969da8;font-size:10px}.selection{position:fixed;z-index:5;top:92px;left:50%;transform:translateX(-50%);padding:11px 17px;background:#fff;border:1px solid #dce2ea;border-radius:7px;font-size:12px;box-shadow:0 3px 12px #00000008;display:none}button:focus-visible,a:focus-visible{outline:2px solid #356dd7;outline-offset:3px}@media(max-width:1100px){.header{flex-wrap:wrap;padding:12px 15px}.brand small{display:none}.options{order:3;width:100%}.option{flex:1;min-width:0}.actions{margin-left:auto}.brand strong{font-size:15px}}@media(max-width:550px){.option{padding:8px}.option small{display:none}.note{display:none}.actions a{display:none}}</style></head><body><div class="gallery"><header class="header"><div class="brand"><img src="assets/ceda-icon.png" alt="Ceda 专属图标"><div><strong>Ceda · 白色工作台</strong><small>三套布局，同一块演示板。选择你喜欢的方向。</small></div></div><nav class="options" aria-label="风格方案"><button class="option active" data-style="a"><strong>A · 极简工作台</strong><small>接近 Codex / 内容优先</small></button><button class="option" data-style="b"><strong>B · 专业工程布局</strong><small>紧凑工具栏 / 对象树</small></button><button class="option" data-style="c"><strong>C · 轻盈 macOS 风格</strong><small>窄图标栏 / 更多留白</small></button></nav><div class="actions"><a id="separate" href="a.html" target="_blank">单独打开 ↗</a><button id="select">选这款</button></div></header><main class="frame"><iframe src="a.html" title="Ceda 风格 A 预览" id="preview"></iframe></main></div><div class="selection" id="selection" role="status"></div><script>
let active='a';const names={a:'极简工作台',b:'专业工程布局',c:'轻盈 macOS 风格'};const frame=document.getElementById('preview');document.querySelectorAll('[data-style]').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('active',x===b));frame.src=active+'.html';frame.title='Ceda 风格 '+active.toUpperCase()+' 预览';document.getElementById('separate').href=active+'.html';}));document.getElementById('select').addEventListener('click',()=>{try{localStorage.setItem('ceda-style-choice',active)}catch{}const status=document.getElementById('selection');status.textContent='已选 '+active.toUpperCase()+' · '+names[active]+'。在聊天里回复字母即可继续。';status.style.display='block';setTimeout(()=>status.style.display='none',4000)});
</script></body></html>
